services:
  # Em dev: docker compose up -d (sobe só postgres + redis)
  # Em prod: docker compose --profile production up -d --build
  node:
    profiles: ['production']
    # Imagem publicada pelo CI no GHCR. IMAGE_TAG recebe o SHA do commit durante o deploy;
    # sem a variável definida (uso local), cai em latest.
    image: ghcr.io/heytorpires/api-nimbus:${IMAGE_TAG:-latest}
    # build continua declarado para permitir construir a imagem localmente
    # (docker compose build). Em produção o CD usa pull, sem --build.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nimbus-api
    restart: unless-stopped
    tty: true
    ports:
      - '${API_PORT}:3333'
    depends_on:
      - postgres
      - redis
    volumes:
      - api_uploads:/usr/src/app/uploads
    env_file:
      - .env

  postgres:
    image: postgres:17-alpine
    container_name: nimbus-postgres
    restart: unless-stopped
    tty: true
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - Postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

  redis:
    image: redis:7-alpine
    container_name: nimbus-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS}
    ports:
      - '${REDIS_PORT}:6379'
    env_file:
      - .env

  rustfs:
    # Storage compatível com S3. Substituiu o MinIO, que saiu do Docker Hub e do quay.io.
    # A API usa o SDK da AWS (S3StorageProvider), que fala S3 com qualquer servidor compatível.
    # Tag fixa para o deploy não mudar sozinho.
    image: rustfs/rustfs:1.0.3
    container_name: nimbus-rustfs
    restart: unless-stopped
    ports:
      # Porta da API S3 (a que a aplicação usa)
      - '${S3_PORT}:9000'
      # Porta do console web de administração
      - '9001:9001'
    environment:
      # Usuário e senha do storage: vêm das variáveis S3_* do .env (as mesmas que a API usa)
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      # Onde o RustFS grava os dados dentro do container (um único diretório = nó único)
      RUSTFS_VOLUMES: /data
      # Endereço e porta da API S3 dentro do container
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # Endereço e porta do console web dentro do container
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      # Liga o console web
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      # O formato de dados do MinIO não é o do RustFS, então o antigo minio_data não é reaproveitável
      - rustfs_data:/data
    env_file:
      - .env

  prometheus:
    # Banco de séries temporais que "raspa" (scrape) o /metrics da API de tempos em tempos
    # e guarda cada valor com timestamp. É ele que responde às consultas PromQL do Grafana.
    # Imagem oficial. Tag latest muda sozinha a cada release (diferente do RustFS, que é fixo);
    # trocar por uma versão fixa quando quiser deploy previsível.
    image: prom/prometheus:latest
    container_name: nimbus-prometheus
    # Volta sozinho se cair ou se a máquina reiniciar; só fica parado se alguém der docker stop
    restart: unless-stopped
    extra_hosts:
      # Cria o hostname host.docker.internal apontando para a máquina host.
      # No Docker Desktop (Mac/Windows) esse nome já existe; no Linux/WSL não, por isso o host-gateway.
      # Serve para o Prometheus raspar a API quando ela roda fora do Docker (yarn dev).
      - 'host.docker.internal:host-gateway'
    volumes:
      # Arquivo de configuração do scrape (quais alvos, de quanto em quanto tempo).
      # Vem do repositório; :ro = somente leitura, o container não consegue alterar o arquivo.
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Diretório onde o Prometheus grava as séries coletadas (TSDB).
      # Volume nomeado: o histórico de métricas sobrevive a recriar/atualizar o container.
      - prometheus_data:/prometheus
    ports:
      # UI web e API HTTP do Prometheus (útil para testar consultas PromQL e ver Status > Targets).
      # :-9090 = valor padrão caso PROMETHEUS_PORT não esteja no .env
      - '${PROMETHEUS_PORT:-9090}:9090'

  grafana:
    # Interface de dashboards. Não coleta nada sozinho: consulta o Prometheus (datasource)
    # e desenha os gráficos. Mesma observação da tag latest acima.
    image: grafana/grafana:latest
    container_name: nimbus-grafana
    restart: unless-stopped
    depends_on:
      # Só garante a ORDEM de subida (Prometheus inicia antes); não espera ele ficar pronto.
      # Sem problema aqui: o Grafana tenta o datasource de novo a cada consulta.
      - prometheus
    environment:
      # Senha do usuário admin do Grafana. Fallback "admin" só é aceitável em máquina local.
      # Atenção: só vale no PRIMEIRO boot; depois a senha fica gravada no volume grafana_data
      # e mudar a variável não altera mais nada (trocar pela UI ou com grafana-cli).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      # Grafana escuta na 3000 dentro do container; no host expõe na 3001 por padrão
      # para não brigar com outros serviços que costumam usar a 3000 (ex: front-end em dev).
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      # Banco interno do Grafana (SQLite): usuários, datasources e dashboards.
      # Hoje o datasource e os painéis são criados na mão pela UI (não há provisioning),
      # então é esse volume que impede de perder tudo ao recriar o container.
      - grafana_data:/var/lib/grafana

volumes:
  Postgres_data:
  api_uploads:
  rustfs_data:
  # Séries temporais coletadas pelo Prometheus
  prometheus_data:
  # Usuários, datasources e dashboards do Grafana
  grafana_data:
