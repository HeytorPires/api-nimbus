services:
  # Em dev: docker compose up -d (sobe só postgres + redis)
  # Em prod: docker compose --profile production up -d --build
  node:
    profiles: ['production']
    # Imagem publicada pelo CI no GHCR. IMAGE_TAG recebe o SHA do commit durante o deploy;
    # sem a variável definida (uso local), cai em latest.
    image: ghcr.io/heytorpires/api-nimbus:${IMAGE_TAG:-latest}
    # build continua declarado para permitir construir a imagem localmente
    # (docker compose build). Em produção o CD usa pull, sem --build.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nimbus-api
    restart: unless-stopped
    tty: true
    ports:
      - '${API_PORT}:3333'
    depends_on:
      - postgres
      - redis
    volumes:
      - api_uploads:/usr/src/app/uploads
    env_file:
      - .env

  postgres:
    image: postgres:17-alpine
    container_name: nimbus-db
    restart: unless-stopped
    tty: true
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - Postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

  redis:
    image: redis:7-alpine
    container_name: redis-nimbus
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS}
    ports:
      - '${REDIS_PORT}:6379'
    env_file:
      - .env

  minio:
    image: minio/minio:latest
    container_name: nimbus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '${MINIO_PORT}:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    env_file:
      - .env

  prometheus:
    image: prom/prometheus:latest
    container_name: nimbus-prometheus
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'

  grafana:
    image: grafana/grafana:latest
    container_name: nimbus-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  Postgres_data:
  api_uploads:
  minio_data:
  prometheus_data:
  grafana_data:
