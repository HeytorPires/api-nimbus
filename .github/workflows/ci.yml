name: CI

on: # Gatilhos para disparar o workflow: push ou pull_request nas branches main e staging
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs: # Definição dos jobs do workflow
  lint:
    name: Lint & Format
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps: # Definição dos passos do job
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      - name: Check formatting
        run: yarn format:check

      - name: Run ESLint
        run: yarn lint

  test:
    name: Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps: # Definição dos passos do job
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      - name: Run tests
        run: yarn test --ci --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps: # Definição dos passos do job
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      - name: Build
        run: yarn build-local

  # Constrói a imagem Docker aqui no CI e publica no GHCR (registry de imagens do GitHub).
  # Assim o CD apenas baixa a imagem pronta, em vez de compilar dentro da VPS de produção.
  docker:
    name: Build & Push image
    timeout-minutes: 30
    # Runner ARM nativo: a VPS Oracle é aarch64 (Ampere). Imagem construída em x86
    # não executa lá — o container morre com "exec format error".
    # Runner ARM é gratuito por este repositório ser público.
    runs-on: ubuntu-24.04-arm
    # Só publica imagem se lint, test e build passarem. Impede que código quebrado vire artefato.
    needs: [lint, test, build]
    # Publica somente em push na main. Pull request valida, mas não gera imagem.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Permissões do GITHUB_TOKEN neste job (por padrão o token não pode escrever no registry).
    permissions:
      contents: read # ler o código do repositório
      packages: write # publicar a imagem no GHCR

    steps:
      # Baixa o código do repositório para o runner. Sem isso não há Dockerfile para construir.
      - uses: actions/checkout@v4

      # Habilita o Buildx, engine de build do Docker que suporta as flags de cache usadas abaixo.
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Autentica no GHCR para conseguir publicar. O GITHUB_TOKEN é gerado automaticamente
      # pelo GitHub a cada execução e expira ao final dela — não é preciso criar secret manual.
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io # host do GitHub Container Registry
          username: ${{ github.actor }} # usuário que disparou o workflow
          password: ${{ secrets.GITHUB_TOKEN }} # token temporário desta execução

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: . # diretório enviado ao build (raiz do projeto)
          file: ./Dockerfile # Dockerfile multi-stage já existente
          platforms: linux/arm64 # arquitetura da VPS de destino
          push: true # publica no registry após construir
          # Duas tags para a mesma imagem:
          # - github.sha: identificador imutável do commit, usado pelo CD e por rollback
          # - latest: atalho de conveniência, sempre aponta para o último deploy da main
          tags: |
            ghcr.io/heytorpires/api-nimbus:${{ github.sha }}
            ghcr.io/heytorpires/api-nimbus:latest
          # Reaproveita as camadas do build anterior (yarn install, tsc) no cache do GitHub.
          # Sem isso cada deploy reinstalaria todas as dependências do zero.
          cache-from: type=gha # lê o cache das execuções anteriores
          cache-to: type=gha,mode=max # grava o cache, mode=max inclui as camadas intermediárias
