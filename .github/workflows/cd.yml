name: CD

on: # Gatilho para disparar o workflow quando o workflow de CI for concluído com sucesso na branch main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production oracle # Define o ambiente das variáveis de ambiente para produção
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps: # Definição dos passos do job
      - name: Validate required secrets # Verifica se as variáveis de ambiente necessárias estão configuradas
        run: |
          missing=""
          [ -z "$VPS_HOST" ]    && missing="$missing VPS_HOST"
          [ -z "$VPS_USER" ]    && missing="$missing VPS_USER"
          [ -z "$VPS_SSH_KEY" ] && missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::The following required repository secrets are not configured:$missing"
            echo "Please add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
        env: # Insere as variáveis de ambiente necessárias para a validação
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy via SSH # Realiza o deploy no servidor via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script:
            | # Comandos a serem executados no servidor para realizar o deploy
            set -e
            cd /home/ubuntu/nimbus/api-nimbus

            # Atualiza o repositório apenas para obter o docker-compose.yml mais recente.
            # O código da aplicação agora chega pela imagem, não por este pull.
            git pull origin main

            # Tag hoje em produção, gravada pelo deploy anterior bem-sucedido. Usada como alvo do rollback.
            PREVIOUS_TAG=$(cat .last_deploy_tag 2>/dev/null || echo "latest")

            # SHA do commit que passou no CI: seleciona exatamente a imagem que foi testada
            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}

            # Baixa do GHCR a imagem já construída pelo CI (sem --build: a VPS não compila nada)
            docker compose --profile production pull

            # Recria os containers usando a imagem baixada
            docker compose --profile production up -d

            # Executa migrations no banco de dados, ignorando erros caso não haja migrations pendentes
            docker exec nimbus-api node -e "
              const { execSync } = require('child_process');
              execSync('npx typeorm migration:run', { stdio: 'inherit' });
            "

            # Healthcheck: função reaproveitada tanto pro deploy novo quanto pra confirmar o rollback.
            # API_PORT vem do .env do próprio container (mesmo env_file do docker-compose.yml) — server.ts escuta nele.
            check_health() {
              for i in $(seq 1 10); do
                if docker exec nimbus-api node -e "
                  const http = require('http');
                  const port = process.env.API_PORT || 3333;
                  http.get('http://localhost:' + port + '/ready', res => process.exit(res.statusCode === 200 ? 0 : 1))
                    .on('error', () => process.exit(1));
                "; then
                  return 0
                fi
                echo "Healthcheck falhou (tentativa $i/10), tentando de novo em 3s..."
                sleep 3
              done
              return 1
            }

            if ! check_health; then
              echo "::error::Deploy da imagem $IMAGE_TAG falhou no healthcheck. Revertendo para $PREVIOUS_TAG..."
              export IMAGE_TAG=$PREVIOUS_TAG
              docker compose --profile production up -d

              if ! check_health; then
                echo "::error::Rollback para $PREVIOUS_TAG também falhou no healthcheck. Intervenção manual necessária."
                exit 1
              fi

              echo "Rollback concluído. Aplicação voltou para a versão $PREVIOUS_TAG."
              exit 1
            fi

            # Só grava a tag e limpa imagens antigas se o deploy novo passou no healthcheck
            echo "$IMAGE_TAG" > .last_deploy_tag
            docker image prune -f

            echo "Deploy completed successfully!"
